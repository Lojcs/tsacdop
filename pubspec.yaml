name: tsacdop_fork
description: An open source podcast player.

version: 0.10.1+1062
publish_to: "none"
environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^4.0.3
  color_thief_dart: ^0.1.0
  confetti: ^0.8.0
  cupertino_icons: ^2.0.0
  crypto: ^3.0.1
  dio_cookie_manager: ^3.1.1
  dio: ^5.7.0
  extended_nested_scroll_view: ^6.2.1
  file_picker: ^13.3.1
  flutter_html: ^3.0.0-beta.2
  fluttertoast: ^10.0.2
  flutter_linkify: ^6.0.0
  flutter_file_dialog: ^3.0.2
  flare_flutter: ^3.0.2
  fl_chart: ^1.0.0
  line_icons: ^2.0.1
  flutter_media_metadata: ^1.0.0+1
  marquee: ^2.0.0
  google_fonts: ^9.0.0
  image: ^4.3.0
  permission_handler: ^12.0.0+1
  provider: ^6.0.0
  sqflite: ^2.0.0+3
  url_launcher: ^6.0.3
  uuid: ^4.5.1
  workmanager: ^0.10.10
  audio_service: ^0.18.0
  just_audio: ^0.10.5
  equatable: ^3.0.0
  path_provider: ^2.0.1
  collection: ^1.15.0-nullsafety.4
  path_provider_android: ^2.3.1
  dynamic_color: ^2.1.0
  focused_menu: ^1.0.5
  linkify: ^5.0.0
  webfeed: ^0.7.0
  flutter_cache_manager: any
  shared_preferences: any
  path: any
  cookie_jar: any
  convert: any
  rxdart: any
  connectivity_plus: ^7.0.0
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0
  intl: any
  xml: any
  webview_flutter: ^4.10.0
  vibration: ^3.1.3
  cryptography_flutter: ^2.3.4
  cryptography: ^2.9.0
  country_flags: ^4.1.2
  flutter_svg: ^2.3.0
  flutter_exit_app: ^2.1.2
  background_downloader: ^9.5.9
  flutter_downloader: ^1.12.1
  copy_with_extension: ^18.0.0
  material_ui: ^1.2.0

dependency_overrides:
  shared_preferences_android: 2.4.27 # 2.5 has a bug
  html: 0.15.6 # 0.15.7 causes a bug in flutter_html
  permission_handler: 12.0.0+1 # 13 requires new build target
  linkify:
    git:
      url: https://github.com/lojcs/linkify.git # Tsacdop fork, updated to 5.0.0
  focused_menu:
    git:
      url: https://github.com/lojcs/focused_menu.git # Tsacdop fork, updated to 1.0.5
  webfeed:
    git:
      url: https://github.com/lojcs/webfeed.git # Tsacdop fork, updated to 0.7.0. Not updated to webfeed_plus
  flutter_media_metadata:
    git:
      url: https://github.com/MihMihai/flutter_media_metadata_enhanced # Updated fork, original stale
  flare_flutter:
    git:
      url: https://github.com/ykh09242/Flare-Flutter # Updated fork, new version of flare is rive
      path: flare_flutter
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.1.10
  pubghost: ^1.0.7
  copy_with_extension_gen: ^18.0.0

flutter:
  assets:
    - assets/
    - assets/google_fonts/
  uses-material-design: true
  generate: true
flutter_intl:
  enabled: true
